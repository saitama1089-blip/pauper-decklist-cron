name: Sync Missing Decks

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Validate two live decks without database access
        type: boolean
        default: false
  repository_dispatch:
    types: [league-cron-complete]
  push:
    branches:
      - main
    paths:
      - 'sync_decks.py'
      - '.github/workflows/sync-decks.yml'

concurrency:
  group: deck-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-decks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check live deck fetching without database access
        if: github.event_name == 'workflow_dispatch' && inputs.check_only
        run: python sync_decks.py --check-decks 8027855 8044902

      - name: Run deck sync
        if: github.event_name != 'workflow_dispatch' || !inputs.check_only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          MAX_DECKS_PER_RUN: '25'
        run: |
          python sync_decks.py
